<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart - DineHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- Navbar (same as your main page) -->
    
    <div class="container my-5">
        <h2>Your Cart</h2>
        <div id="cart-items" class="mb-4">
            <!-- Cart items will be displayed here -->
        </div>
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">Order Summary</h5>
                <div class="d-flex justify-content-between mb-2">
                    <span>Subtotal:</span>
                    <span id="subtotal">Rs. 0</span>
                </div>
                <div class="d-flex justify-content-between mb-3">
                    <span>Tax (5%):</span>
                    <span id="tax">Rs. 0</span>
                </div>
                <div class="d-flex justify-content-between fw-bold fs-5">
                    <span>Total:</span>
                    <span id="total">Rs. 0</span>
                </div>
                <button id="checkout-btn" class="btn btn-danger w-100 mt-3">Proceed to Checkout</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const cartItems = JSON.parse(localStorage.getItem('cartItems')) || [];
            const cartContainer = document.getElementById('cart-items');
            const subtotalElement = document.getElementById('subtotal');
            const taxElement = document.getElementById('tax');
            const totalElement = document.getElementById('total');
            
            if (cartItems.length === 0) {
                cartContainer.innerHTML = '<p>Your cart is empty.</p>';
                return;
            }
            
            let subtotal = 0;
            let html = '';
            
            cartItems.forEach((item, index) => {
                subtotal += item.price * item.quantity;
                
                html += `
                    <div class="card mb-3">
                        <div class="card-body">
                            <div class="d-flex justify-content-between">
                                <div>
                                    <h5 class="card-title">${item.name}</h5>
                                    <p class="card-text">Rs. ${item.price}</p>
                                    ${item.instructions ? `<p class="text-muted"><small>Instructions: ${item.instructions}</small></p>` : ''}
                                </div>
                                <div class="d-flex align-items-center">
                                    <button class="btn btn-outline-danger btn-sm me-2 decrease-btn" data-index="${index}">-</button>
                                    <span class="mx-2">${item.quantity}</span>
                                    <button class="btn btn-outline-danger btn-sm me-2 increase-btn" data-index="${index}">+</button>
                                    <button class="btn btn-danger btn-sm remove-btn" data-index="${index}">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            cartContainer.innerHTML = html;
            
            // Calculate totals
            const tax = subtotal * 0.05;
            const total = subtotal + tax;
            
            subtotalElement.textContent = `Rs. ${subtotal}`;
            taxElement.textContent = `Rs. ${tax.toFixed(2)}`;
            totalElement.textContent = `Rs. ${total.toFixed(2)}`;
            
            // Add event listeners for quantity buttons
            document.querySelectorAll('.increase-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const index = this.getAttribute('data-index');
                    cartItems[index].quantity++;
                    localStorage.setItem('cartItems', JSON.stringify(cartItems));
                    location.reload();
                });
            });
            
            document.querySelectorAll('.decrease-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const index = this.getAttribute('data-index');
                    if (cartItems[index].quantity > 1) {
                        cartItems[index].quantity--;
                        localStorage.setItem('cartItems', JSON.stringify(cartItems));
                        location.reload();
                    }
                });
            });
            
            document.querySelectorAll('.remove-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const index = this.getAttribute('data-index');
                    cartItems.splice(index, 1);
                    localStorage.setItem('cartItems', JSON.stringify(cartItems));
                    location.reload();
                });
            });
            
            // Checkout button
            document.getElementById('checkout-btn').addEventListener('click', function() {
                // Show modal for payment
const paymentModal = new bootstrap.Modal(document.getElementById('paymentModal'));
paymentModal.show();

            });
        });
    </script>

<!-- Payment Modal -->
<div class="modal fade" id="paymentModal" tabindex="-1" aria-labelledby="paymentModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="paymentForm">
        <div class="modal-header">
          <h5 class="modal-title" id="paymentModalLabel">Select Payment Method</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <select class="form-select" id="paymentMethod" required>
            <option value="">Choose one</option>
            <option value="Cash on Delivery">Cash on Delivery</option>
            <option value="JazzCash">JazzCash</option>
            <option value="EasyPaisa">EasyPaisa</option>
            <option value="Bank Transfer">Bank Transfer</option>
          </select>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-danger">Confirm Payment</button>
        </div>
      </form>
    </div>
  </div>
</div>
<script>
  // Handle payment form submission
  document.getElementById('paymentForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const method = document.getElementById('paymentMethod').value;
    if (!method) {
      alert("Please select a payment method.");
      return;
    }

    // ✅ Clear cart from localStorage
    localStorage.removeItem('cartItems');

    // Optional success message
    alert(`✅ Order placed successfully via ${method}!`);

    // Reload to reflect empty cart
    window.location.reload();
  });
</script>




<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>





</body>
</html>
