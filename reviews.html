<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Visitor Reviews</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <div class="container py-5">
    <h2 class="mb-4">Leave a Review</h2>
    <form id="commentForm" class="mb-4">
      <div class="mb-3">
        <label for="name" class="form-label">Your Name</label>
        <input type="text" class="form-control" id="name" required />
      </div>
      <div class="mb-3">
        <label for="message" class="form-label">Your Comment</label>
        <textarea class="form-control" id="message" rows="4" required></textarea>
      </div>
      <button type="submit" class="btn btn-primary">Submit Comment</button>
    </form>

    <h3>User Comments</h3>
    <ul id="commentsList" class="list-group"></ul>
  </div>

  <script>
    async function fetchComments() {
      const res = await fetch('/api/reservations/comment');
      const comments = await res.json();
      const list = document.getElementById('commentsList');
      list.innerHTML = '';
      comments.forEach(c => {
        const li = document.createElement('li');
        li.className = 'list-group-item';
        li.innerHTML = `<strong>${c.name}</strong>: ${c.message}`;
        list.appendChild(li);
      });
    }

    document.getElementById('commentForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const message = document.getElementById('message').value.trim();

      if (!name || !message) return;

      await fetch('/api/reservations/comment', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, message })
      });

      document.getElementById('name').value = '';
      document.getElementById('message').value = '';
      fetchComments();
    });

    fetchComments();
  </script>
</body>
</html>
