<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Dashboard - DineHub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
  <nav class="navbar navbar-light bg-danger">
    <div class="container-fluid">
      <span class="navbar-brand text-white fw-bold">Admin Dashboard</span>
      <button class="btn btn-outline-light" onclick="logout()">Sign Out</button>
    </div>
  </nav>

  <div class="container mt-4">
    <h3>All Reservations</h3>
    <div id="reservationTable" class="table-responsive"></div>

    <h3 class="mt-5">All Orders</h3>
    <div id="orderTable" class="table-responsive"></div>
  </div>

  <script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/frontend/admin/login.html';

    async function fetchData() {
      const headers = { 'Authorization': `Bearer ${token}` };
      const resRes = await fetch('http://localhost:5000/api/admin/reservations', { headers });
      const resOrd = await fetch('http://localhost:5000/api/admin/orders', { headers });

      const reservations = await resRes.json();
      const orders = await resOrd.json();

      // render tables
      document.getElementById('reservationTable').innerHTML = generateTable(reservations, 'reservation');
      document.getElementById('orderTable').innerHTML = generateTable(orders, 'order');
    }

    function generateTable(data, type) {
      if (!data.length) return '<p>No data available.</p>';
      const keys = Object.keys(data[0]);
      return `
        <table class="table table-bordered">
          <thead><tr>${keys.map(k => `<th>${k}</th>`).join('')}<th>Actions</th></tr></thead>
          <tbody>
            ${data.map(item => `
              <tr>
                ${keys.map(k => `<td>${item[k]}</td>`).join('')}
                <td>
                  <button class="btn btn-sm btn-danger" onclick="deleteItem('${type}', '${item._id}')">Delete</button>
                </td>
              </tr>`).join('')}
          </tbody>
        </table>`;
    }

    async function deleteItem(type, id) {
      if (!confirm("Are you sure to delete this item?")) return;
      await fetch(`/api/admin/${type}s/${id}`, {
        method: 'DELETE',
        headers: { 'Authorization': `Bearer ${token}` }
      });
      fetchData();
    }

    function logout() {
      localStorage.removeItem('token');
      window.location.href = '/frontend/admin/login.html';
    }

    fetchData();
  </script>
</body>
</html>
